name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          pkg="v$(node -p 'require("./package.json").version')"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Skip if this version is already on npm
        id: check
        run: |
          spec="$(node -p 'const p=require("./package.json"); p.name+"@"+p.version')"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "::notice::$spec is already published, skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # Auth via trusted publisher configured on npmjs.com — no NPM_TOKEN needed
      - if: steps.check.outputs.published != 'true'
        run: npm publish --access public
